[package]
name = "yunzai"
version = "3.1.3"
edition = "2024"
description = "TRSS-Yunzai rewritten in Rust"
authors = ["xiaocongyu66"]
license = "GPL-3.0"

[workspace]
members = [".", "bridge"]

[features]
default = []
deno = []

[dependencies]
flate2 = "1"
parcel_selectors = "0.28.3"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
futures = "0.3"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
redis = { version = "0.27", features = ["tokio-comp"] }
regex = "1"
chrono = "0.4"
notify = "6"
taffy = "0.5"
html5ever = "0.27"
tendril = "0.4"
markup5ever_rcdom = "0.3"
cssparser = "0.37"
cosmic-text = "0.12"
tiny-skia = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
resvg = "0.44"
lightningcss = { version = "1.0.0-alpha.57", features = ["visitor"] }

# ps-blitz 渲染栈（pathscale 增强版 Blitz：JS 引擎/position:fixed/shadow DOM/floats 可选；
# crates.io 0.4.12，包名 ps-* 经 rename 保持 blitz_* 代码路径不变；字体全靠 fontDirs + @font-face）
blitz-html = { version = "0.4.12", package = "ps-blitz-html", default-features = false }
blitz-dom = { version = "0.4.12", package = "ps-blitz-dom", default-features = false, features = ["svg", "woff", "floats"] }
blitz-paint = { version = "0.4.12", package = "ps-blitz-paint", default-features = false, features = ["svg"] }
blitz-net = { version = "0.4.12", package = "ps-blitz-net", default-features = false }
blitz-traits = { version = "0.4.12", package = "ps-blitz-traits", default-features = false }
parley = { version = "0.10", default-features = false, features = ["std"] }
anyrender = { version = "0.13.0", package = "ps-anyrender" }
peniko = "0.6.0"
anyrender_vello_cpu = { version = "0.17.1", package = "ps-anyrender-vello-cpu" }
ps-taffy = { version = "0.13.0", package = "ps-taffy", default-features = false, features = ["float_layout"] }
png = "0.18"

ulid = "1"
once_cell = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "blocking"] }
md-5 = "0.10"
sha2 = "0.10"
libloading = "0.8"
lzma-rs = "0.3"
futures-util = "0.3"
anyhow = "1"

[dev-dependencies]
tokio-tungstenite = "0.24"
tempfile = "3"

[profile.release]
opt-level = 2
lto = false

# box-shadow σ 按 CSS 规范换算（σ=blur/2）——上游直传 blur 致 1px 细线比 Chrome 浓 ~1.9 倍
[patch.crates-io]
ps-anyrender = { git = "https://github.com/xiaocongyu66/ps-anyrender" }
ps-anyrender-vello-cpu = { git = "https://github.com/xiaocongyu66/ps-anyrender" }
ps-blitz-paint = { git = "https://github.com/xiaocongyu66/ps-blitz", branch = "v0.4.12-fix" }
# blitz-paint 从 git 拉取后，其 workspace 成员（dom/html/net/traits）也必须同源，否则依赖图两份实例类型不匹配
ps-blitz-dom = { git = "https://github.com/xiaocongyu66/ps-blitz", branch = "v0.4.12-fix" }
ps-blitz-html = { git = "https://github.com/xiaocongyu66/ps-blitz", branch = "v0.4.12-fix" }
ps-blitz-net = { git = "https://github.com/xiaocongyu66/ps-blitz", branch = "v0.4.12-fix" }
ps-blitz-traits = { git = "https://github.com/xiaocongyu66/ps-blitz", branch = "v0.4.12-fix" }
