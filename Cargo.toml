[package]
name = "yunzai"
version = "3.1.3"
edition = "2021"
description = "TRSS-Yunzai rewritten in Rust"
authors = ["xiaocongyu66"]
license = "GPL-3.0"

[features]
default = []
deno = []

[dependencies]
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
futures = "0.3"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
redis = { version = "0.27", features = ["tokio-comp"] }
regex = "1"
chrono = "0.4"
ulid = "1"
once_cell = "1"
base64 = "0.22"
rquickjs = { version = "0.8", features = ["parallel", "loader"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
md-5 = "0.10"
sha2 = "0.10"

[dev-dependencies]
tokio-tungstenite = "0.24"
tempfile = "3"

[profile.release]
opt-level = 2
lto = false
