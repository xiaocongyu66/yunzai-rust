[package]
name = "yunzai"
version = "3.1.3"
edition = "2024"
description = "TRSS-Yunzai rewritten in Rust"
authors = ["xiaocongyu66"]
license = "GPL-3.0"

[workspace]
members = [".", "bridge"]

[features]
default = []
deno = []

[dependencies]
flate2 = "1"
parcel_selectors = "0.28.3"
tokio = { version = "1", features = ["full"] }
axum = { version = "0.8", features = ["ws"] }
futures = "0.3"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
redis = { version = "0.27", features = ["tokio-comp"] }
regex = "1"
chrono = "0.4"
notify = "6"
taffy = "0.5"
html5ever = "0.27"
tendril = "0.4"
markup5ever_rcdom = "0.3"
cssparser = "0.37"
cosmic-text = "0.12"
tiny-skia = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
resvg = "0.44"
lightningcss = { version = "1.0.0-alpha.57", features = ["visitor"] }

# Blitz 渲染引擎（stylo 样式 + taffy 布局 + vello_cpu CPU 光栅化；GPU 特性后补）
blitz-html = { git = "https://github.com/DioxusLabs/blitz", rev = "89e5e615aea649a1a9630c526956aa3d90a3afa7", default-features = false }
blitz-dom = { git = "https://github.com/DioxusLabs/blitz", rev = "89e5e615aea649a1a9630c526956aa3d90a3afa7", default-features = false, features = ["svg", "woff", "system-fonts"] }
blitz-paint = { git = "https://github.com/DioxusLabs/blitz", rev = "89e5e615aea649a1a9630c526956aa3d90a3afa7", default-features = false, features = ["svg"] }
blitz-net = { git = "https://github.com/DioxusLabs/blitz", rev = "89e5e615aea649a1a9630c526956aa3d90a3afa7", default-features = false }
parley = { git = "https://github.com/linebender/parley", rev = "718dcb721941fd8e72128833122d31f5a4e80504", default-features = false, features = ["std"] }
anyrender = "0.13.0"
peniko = "0.6.0"
anyrender_vello_cpu = "0.17.0"
png = "0.18"

ulid = "1"
once_cell = "1"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "blocking"] }
md-5 = "0.10"
sha2 = "0.10"
libloading = "0.8"
lzma-rs = "0.3"
futures-util = "0.3"
anyhow = "1"

[dev-dependencies]
tokio-tungstenite = "0.24"
tempfile = "3"

[profile.release]
opt-level = 2
lto = false
