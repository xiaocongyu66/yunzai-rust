name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build (release)
        run: cargo build --release --target ${{ matrix.target }}

      - name: Run E2E tests
        if: matrix.cross == false
        run: |
          cargo test --release -- --nocapture 2>&1 | tee test.log
          exit ${PIPESTATUS[0]}

      - uses: actions/upload-artifact@v4
        if: matrix.cross == false
        name: test-log
        with:
          name: test-log
          path: test.log

      - name: Rename artifact
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/yunzai dist/yunzai-${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: yunzai-${{ matrix.target }}
          path: dist/
