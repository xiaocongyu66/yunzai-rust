name: Build

on:
  push:
    branches: [main]
    paths: &paths
      - "src/**"
      - "build.rs"
      - ".github/workflows/**"
      - "bridge/**"
      - "libnode/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    branches: [main]
    paths: *paths
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            cross: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build (release, workspace - 主程序 + bridge)
        run: |
          # 先单独编 bridge 拿 napi 桥，供主程序编译期内嵌
          cargo build -p yz-bridge --release --target ${{ matrix.target }}
          BRIDGE=$(ls target/${{ matrix.target }}/release/ | grep -E '^libyz_bridge\.(so|dylib)$' | head -1 || true)
          if [ -n "$BRIDGE" ]; then
            export YZ_BRIDGE_BIN="$GITHUB_WORKSPACE/target/${{ matrix.target }}/release/$BRIDGE"
            echo "embed bridge: $YZ_BRIDGE_BIN"
          fi
          cargo build --workspace --release --target ${{ matrix.target }}

      - name: Checkout JavaScript runtime
        uses: actions/checkout@v4
        with:
          repository: TimeRainStarSky/Yunzai
          ref: 79a79c3defd9111429cd1da2acd120f22e68aa29
          path: runtime-source

      - name: Install production JavaScript runtime
        working-directory: runtime-source
        run: |
          corepack enable
          pnpm install --prod --no-frozen-lockfile
          test -f package.json
          test -f pnpm-lock.yaml

      - name: Stage complete runtime bundle
        run: |
          rm -rf dist
          mkdir -p dist/bin dist/lib dist/config dist/data/libnode dist/plugins dist/renderers dist/resources
          cp "target/${{ matrix.target }}/release/yunzai" dist/bin/yunzai
          chmod +x dist/bin/yunzai

          # Keep the Rust-generated configuration defaults and plugins in the same
          # root as the executable; the runtime must not depend on the checkout cwd.
          cp -a config/default_config dist/config/
          cp -a runtime-source/plugins/. dist/plugins/
          cp -a plugins/. dist/plugins/
          cp -a runtime-source/lib/. dist/lib/
          cp -aL runtime-source/node_modules dist/node_modules
          cp -a runtime-source/renderers/. dist/renderers/
          cp -a runtime-source/resources/. dist/resources/
          cp runtime-source/package.json dist/package.json
          cp runtime-source/pnpm-lock.yaml dist/pnpm-lock.yaml
          cp runtime-source/LICENSE dist/TRSS-Yunzai-LICENSE
          cp src/nodejs/host.mjs dist/host.mjs

          EXT=$(ls target/${{ matrix.target }}/release/ | grep -E '^libyz_bridge\\.(so|dylib)$' | head -1 || true)
          test -n "$EXT"
          cp "target/${{ matrix.target }}/release/$EXT" dist/lib/yz_bridge.node

          case "${{ matrix.target }}" in
            aarch64-unknown-linux-gnu)
              archive=bin/libnode-linux-arm64.so.xz
              libnode=libnode-linux-arm64.so
              ;;
            x86_64-unknown-linux-gnu)
              archive=bin/libnode-linux-x86_64.so.xz
              libnode=libnode-linux-x86_64.so
              ;;
            *) echo "unsupported release target: ${{ matrix.target }}" >&2; exit 1 ;;
          esac
          printf 'staging libnode archive: %s\n' "$archive"
          ls -l bin
          test -r "$archive" || { echo "missing libnode archive: $archive" >&2; exit 1; }
          xz -dc "$archive" > "dist/data/libnode/$libnode" || { echo "cannot decompress libnode archive: $archive" >&2; exit 1; }
          test -s "dist/data/libnode/$libnode" || { echo "empty libnode: $libnode" >&2; exit 1; }
          wc -c "dist/data/libnode/$libnode"

          echo "LIBNODE_PATH=$PWD/dist/data/libnode/$libnode" >> "$GITHUB_ENV"
          echo "YZ_BRIDGE_PATH=$PWD/dist/lib/yz_bridge.node" >> "$GITHUB_ENV"
          find dist -maxdepth 3 -type f -printf '%P\\n' | sort

      - name: Validate complete runtime bundle
        run: bash scripts/bundle-smoke.sh dist "$GITHUB_WORKSPACE"

      - name: Run E2E tests
        if: matrix.cross == false
        run: |
          cargo test --release -- --nocapture 2>&1 | tee test.log
          exit ${PIPESTATUS[0]}

      - uses: actions/upload-artifact@v4
        name: test-log-${{ matrix.target }}
        with:
          name: test-log-${{ matrix.target }}
          path: test.log
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
