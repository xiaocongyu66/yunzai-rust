name: Build

on:
  push:
    branches: [main]
    paths: &paths
      - "src/**"
      - "bridge/**"
      - "libnode/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    branches: [main]
    paths: *paths
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            cross: true
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build (release, workspace - 主程序 + bridge)
        run: cargo build --workspace --release --target ${{ matrix.target }}

      - name: Stage bridge addon (yz_bridge.node)
        run: |
          mkdir -p dist/lib
          EXT=$(ls target/${{ matrix.target }}/release/ | grep -E '^libyz_bridge\.(so|dylib)$' | head -1 || true)
          if [ -n "$EXT" ]; then
            cp "target/${{ matrix.target }}/release/$EXT" dist/lib/yz_bridge.node
            echo "staged dist/lib/yz_bridge.node"
          else
            ls target/${{ matrix.target }}/release/ | head -20
            exit 1
          fi

      - name: Prepare libnode for tests
        if: matrix.cross == false
        run: |
          curl -sL --retry 3 --retry-delay 5 -o libnode.so.xz https://raw.githubusercontent.com/xiaocongyu66/yunzai-rust/main/bin/libnode-linux-x86_64.so.xz
          xz -d -k libnode.so.xz
          ls -la libnode-linux-x86_64.so dist/lib/yz_bridge.node
          echo "LIBNODE_PATH=$PWD/libnode-linux-x86_64.so" >> $GITHUB_ENV
          echo "YZ_BRIDGE_PATH=$PWD/dist/lib/yz_bridge.node" >> $GITHUB_ENV

      - name: Run E2E tests
        if: matrix.cross == false
        run: |
          cargo test --release -- --nocapture 2>&1 | tee test.log
          exit ${PIPESTATUS[0]}

      - uses: actions/upload-artifact@v4
        if: matrix.cross == false
        name: test-log
        with:
          name: test-log
          path: test.log

      - name: Rename artifact
        run: |
          cp target/${{ matrix.target }}/release/yunzai dist/yunzai-${{ matrix.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: yunzai-${{ matrix.target }}
          path: dist/
