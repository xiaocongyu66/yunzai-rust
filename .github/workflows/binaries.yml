name: Binaries

# libnode.so 一次性构建工程：
#   用 libnode/ 目录的补丁 + 脚本，从 Node.js 官方源码构建 libnode 动态库
#   产物为裸二进制，构建成功后自动平铺提交到仓库 bin/ 目录（[skip ci] 防循环）
#   主程序（yunzai）的构建见 build.yml

on:
  push:
    branches: [main]
    paths:
      - "libnode/**"
      - ".github/workflows/binaries.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  libnode:
    name: libnode-${{ matrix.out }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, script: build-linux-arm64.bash, out: linux-arm64 }
          - { os: ubuntu-latest, script: build-linux-amd64.bash, out: linux-x86_64 }
          - { os: macos-14, script: build-macos-arm64.bash, out: macos-arm64 }
          - { os: macos-13, script: build-macos-amd64.bash, out: macos-x86_64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: Build libnode (node source + embedding patch)
        # linux 脚本内 apt-get 需要 root；macOS runner 自带免密 sudo 也可直接跑
        run: sudo -E bash libnode/scripts/${{ matrix.script }}
        env:
          NODEJS_GIT: https://github.com/nodejs/node
          NODEJS_BRANCH: v24.5.0

      - name: Stage binary
        run: |
          mkdir -p dist
          cp release/libnode-*/libnode.so dist/libnode-${{ matrix.out }}.so
          cp release/libnode-*/node dist/libnode-${{ matrix.out }}-node 2>/dev/null || true
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.out }}
          path: dist/
          retention-days: 3

  # 汇总：全部构建成功 → 裸文件平铺提交到 bin/
  commit-binaries:
    name: Commit to bin/
    needs: libnode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: bundle-*

      - name: Place into bin/
        run: |
          rm -rf bin
          mkdir -p bin
          # 直接平铺裸二进制：artifacts/bundle-*/libnode-* → bin/
          find artifacts -type f -name "libnode-*" -exec cp {} bin/ \;
          ls -la bin/

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin
          if git diff --cached --quiet; then
            echo "无产物变更"
          else
            git commit -m "ci: libnode 产物 [skip ci] (${GITHUB_SHA::7})"
            git push origin main
          fi
