name: Binaries

# libnode.so 一次性构建工程：
#   用 libnode/ 目录的补丁 + 脚本，从 Node.js 官方源码构建 libnode 动态库
#   产物为裸二进制，构建成功后自动平铺提交到仓库 bin/ 目录（[skip ci] 防循环）
#   主程序（yunzai）的构建见 build.yml

on:
  push:
    branches: [main]
    paths:
      - "libnode/**"
      - "!libnode/README.md"
      - "!libnode/LICENSE"
  workflow_dispatch:

permissions:
  contents: write

# 私有仓库配额有限：同一分支的新构建自动取消旧构建
concurrency:
  group: binaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  libnode:
    name: libnode-${{ matrix.out }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04-arm, script: build-linux-arm64.bash, out: linux-arm64 }
          - { os: ubuntu-latest, script: build-linux-amd64.bash, out: linux-x86_64 }
          - { os: macos-14, script: build-macos-arm64.bash, out: macos-arm64 }
          - { os: macos-13, script: build-macos-amd64.bash, out: macos-x86_64 }
          - { os: ubuntu-24.04-arm, script: build-linux-armv7.bash, out: linux-armv7 }
          - { os: ubuntu-latest, script: build-linux-i386.bash, out: linux-i386 }
          # Node v22 的 vcbuild 只认 VS2022(17.x)，windows-latest 已是 VS 18 → 用 windows-2022 镜像
          - { os: windows-2022, script: build-windows-amd64.ps1, out: windows-x86_64, msvc: x64 }
          - { os: windows-2022, script: build-windows-arm64.ps1, out: windows-arm64, msvc: amd64_arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 300
    continue-on-error: ${{ contains(matrix.script, 'armv7') || contains(matrix.script, 'i386') || contains(matrix.script, 'windows-arm64') }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC dev environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc }}

      # linux 脚本内 apt-get 需要 root；macOS 的 Homebrew 拒绝 root，直接跑
      - name: Build libnode (linux)
        if: runner.os == 'Linux'
        run: sudo -E bash libnode/scripts/${{ matrix.script }}
        env:
          NODEJS_GIT: https://github.com/nodejs/node
          NODEJS_BRANCH: v22.22.0

      - name: Build libnode (macos)
        if: runner.os == 'macOS'
        run: bash libnode/scripts/${{ matrix.script }}
        env:
          NODEJS_GIT: https://github.com/nodejs/node
          NODEJS_BRANCH: v22.22.0

      - name: Build libnode (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: libnode/scripts/${{ matrix.script }}
        env:
          NODEJS_GIT: https://github.com/nodejs/node
          NODEJS_BRANCH: v22.22.0

      - name: Stage binary (unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          cp release/libnode-*/libnode.so dist/libnode-${{ matrix.out }}.so
          cp release/libnode-*/node dist/libnode-${{ matrix.out }}-node 2>/dev/null || true
          ls -la dist/

      - name: Stage binary (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item release/libnode-*/libnode.dll dist/libnode-${{ matrix.out }}.dll -ErrorAction SilentlyContinue
          Get-ChildItem release/libnode-*/ -Filter "libnode.*" | Copy-Item -Destination dist -ErrorAction SilentlyContinue
          Get-ChildItem dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.out }}
          path: dist/
          retention-days: 3

  # 汇总：全部构建成功 → 裸文件平铺提交到 bin/
  commit-binaries:
    name: Commit to bin/
    needs: libnode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: bundle-*

      - name: Place into bin/
        run: |
          rm -rf bin
          mkdir -p bin
          # 直接平铺裸二进制：artifacts/bundle-*/libnode-* → bin/
          find artifacts -type f -name "libnode-*" -exec cp {} bin/ \;
          ls -la bin/

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bin
          if git diff --cached --quiet; then
            echo "无产物变更"
          else
            git commit -m "ci: libnode 产物 [skip ci] (${GITHUB_SHA::7})"
            git push origin main
          fi
