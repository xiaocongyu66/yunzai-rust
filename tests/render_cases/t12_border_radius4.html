<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>t12 border-radius 多值</title>
<style>
  body { width: 600px; margin: 0; padding: 0; }
</style>
</head>
<body>
  <!-- 预期：600x200 画布。红块 200x200 位于左上，border-radius: 60px 0 60px 0。
       当前引擎语义：取首值 60px 应用于四角（四角独立为已知缺口），即四角均为 60px 圆角切削：
       四角圆心分别在 (60,60) (140,60) (60,140) (140,140)，半径 60。 -->
  <!-- 采样：(5,5)白(圆角外) (60,60)红(圆弧上内侧) (100,2)红(上边中点) (2,100)红(左边中点) (195,195)白 (100,100)红 -->
  <div style="width: 200px; height: 200px; background-color: #e74c3c; border-radius: 60px 0 60px 0;"></div>
</body>
</html>
